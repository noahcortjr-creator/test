<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>KinoFind – Тест Плеера KinoBD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0b0b10;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    h1 { font-size: 22px; margin-bottom: 20px; }
    .box {
      background: #15151f;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    input, button {
      width: 100%;
      padding: 14px;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      margin-top: 10px;
    }
    input {
      background: #232335;
      color: #fff;
    }
    input::placeholder {
      color: #7c7c93;
    }
    button {
      background: #ffb300;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #e09e00;
    }
    .info { margin-top: 8px; font-size: 14px; }
    .kp { color: #7dd3fc; font-weight: bold; }
    .player {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      min-height: 220px;
    }
    iframe {
      width: 100%;
      height: 400px;
      border: none;
      display: block;
    }
    
    /* Стили для блока логов */
    .debug-log {
      background: #1e1e2e;
      border: 1px solid #313244;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      color: #a6e3a1;
      max-height: 250px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: 10px;
    }
    .debug-title {
      font-size: 14px;
      color: #cdd6f4;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>🎬 Test Kinopoisk API → KinoBD API</h1>

<div class="box">
  <input id="query" placeholder="Введите название фильма или ID (например: 2260)">
  <button onclick="searchAndPlay()">▶ Найти и смотреть</button>

  <div class="info" id="status">Статус: ожидание</div>
  <div class="info kp">Kinopoisk ID: <span id="kpValue">—</span></div>
</div>

<div class="box">
  <div class="player" id="playerWrap"></div>
  
  <!-- Блок вывода логов на экран устройства -->
  <div class="debug-title">🛠 Системный лог отладки:</div>
  <div id="debugConsole" class="debug-log">Здесь будут отображаться технические шаги...</div>
</div>

<script>
/* ======================
   CONFIG
====================== */
const KP_API_KEY = "b59acb61-405d-4a24-b967-408af118e819";

/* ======================
   UI ELEMENTS & LOGGING
====================== */
const statusEl = document.getElementById("status");
const kpEl = document.getElementById("kpValue");
const playerWrap = document.getElementById("playerWrap");
const debugConsole = document.getElementById("debugConsole");

function setStatus(t){ statusEl.textContent = "Статус: " + t; addLog("[СТАТУС] " + t); }
function setKP(v){ kpEl.textContent = v || "—"; }

// Функция записи логов на экран
function addLog(message, isError = false) {
  const time = new Date().toLocaleTimeString();
  const color = isError ? "#f38ba8" : "#a6e3a1";
  debugConsole.innerHTML += `<span style="color: ${color}">[${time}] ${message}</span>\n`;
  debugConsole.scrollTop = debugConsole.scrollHeight;
}

/* ======================
   API КИНОПОИСКА
====================== */
async function searchFilm(query){
  if (/^\d+$/.test(query)) {
    addLog("Введен числовой ID, пропускаем поиск по названию Кинопоиска.");
    return { films: [{ filmId: query }] };
  }

  const url = `https://kinopoiskapiunofficial.tech{encodeURIComponent(query)}&page=1`;
  addLog("Запрос к Кинопоиску: " + url);

  const res = await fetch(url, {
    headers: {
      "X-API-KEY": KP_API_KEY,
      "Content-Type": "application/json"
    }
  });

  if(!res.ok) throw new Error("Kinopoisk API вернул статус: " + res.status);
  return await res.json();
}

/* ======================
   ОБРАБОТКА И ЗАПУСК ПЛЕЕРА KINOBD (БЕЗ РЕГУЛЯРНЫХ ВЫРАЖЕНИЙ)
====================== */
async function loadPlayer(kpId) {
  try {
    debugConsole.innerHTML = ""; 
    setStatus("получаем данные из базы KinoBD...");

    const apiUrl = `https://kinobd.net/api/player/search?q=${kpId}&type=kp_id`;
    addLog("Отправка запроса к KinoBD API: " + apiUrl);
    
    const response = await fetch(apiUrl);
    
    if (!response.ok) throw new Error("Сервер KinoBD вернул ошибку " + response.status);
    
    const result = await response.json();
    addLog("JSON успешно распарсен.");

    if (!result.data || result.data.length === 0) {
      throw new Error("Сервер не нашёл плееры для ID: " + kpId);
    }

    addLog(`Найдено плееров в массиве: ${result.data.length}. Берем первый.`);
    const playerItem = result.data[0]; // Извлекаем первый плеер
    
    const rawIframeStr = playerItem.iframe; 
    if (!rawIframeStr) {
      throw new Error("Внутри объекта playerItem отсутствует свойство 'iframe'");
    }

    // ИСПОЛЬЗУЕМ КОРРЕКТНЫЙ HTML-ПАРСЕР БРАУЗЕРА ВМЕСТО РЕГУЛЯРОК
    // Браузер сам уберет все экранирующие слэши \, кавычки и соберет чистый тег
    const parser = new DOMParser();
    const cleanHtmlDoc = parser.parseFromString(rawIframeStr.replace(/\\"/g, '"').replace(/\\/g, ''), 'text/html');
    const iframeElement = cleanHtmlDoc.querySelector('iframe');

    if (!iframeElement) {
      throw new Error("Не удалось преобразовать строку ответа в HTML-элемент iframe");
    }

    // Извлекаем ссылку. Если у них используется lazy-load, то адрес будет в data-src, иначе в src
    let finalVideoUrl = iframeElement.getAttribute('data-src') || iframeElement.getAttribute('src');

    if (!finalVideoUrl) {
      throw new Error("Внутри iframe не найдены атрибуты src или data-src");
    }

    // Если ссылка начинается с сомнительных протоколов или имеет относительный путь, корректируем её
    if (finalVideoUrl.startsWith('//')) {
      finalVideoUrl = 'https:' + finalVideoUrl;
    }

    addLog("Браузер успешно извлек чистую ссылку: " + finalVideoUrl);

    // Выводим iframe на экран, передавая ему абсолютно все оригинальные параметры
        // Заменяем заблокированное зеркало на официальный и разрешенный домен плеера
    playerWrap.innerHTML = `
      <iframe src="https://kinobd.net/player/${kpId}" 
              width="100%" 
              height="400px" 
              frameborder="0" 
              referrerpolicy="no-referrer"
              allowfullscreen>
      </iframe>`;

      
    setStatus("плеер успешно инициализирован и запущен!");

  } catch (error) {
    console.error(error);
    addLog("КРИТИЧЕСКАЯ ОШИБКА: " + error.message, true);
    setStatus("ошибка загрузки плеера");
    playerWrap.innerHTML = `
      <div style='padding:40px 20px; color:#ff4a4a; text-align:center; font-size:14px; background:#1a1a26; border-radius:12px;'>
        ❌ Load failed (404 Not Found)
      </div>`;
  }
}


/* ======================
   ГЛАВНАЯ УПРАВЛЯЮЩАЯ ФУНКЦИЯ
====================== */
async function searchAndPlay(){
  const q = document.getElementById("query").value.trim();
  if(!q){
    alert("Введите название фильма или Кинопоиск ID");
    return;
  }

  setStatus("ищем фильм...");
  setKP("ищу…");
  playerWrap.innerHTML = ""; 

  try {
    const data = await searchFilm(q);

    if(!data.films || !data.films.length){
      throw new Error("Фильм не найден на Кинопоиске");
    }

    const firstFilm = data.films[0]; 
    const kpId = firstFilm.filmId;

    setKP(kpId);
    await loadPlayer(kpId);

  } catch(e) {
    console.error(e);
    addLog("Ошибка поиска: " + e.message, true);
    setStatus("ошибка: фильм не найден");
    setKP("не найден");
    playerWrap.innerHTML = `
      <div style='padding:40px 20px; color:#ff4a4a; text-align:center; font-size:14px; background:#1a1a26; border-radius:12px;'>
        По вашему запросу ничего не найдено.
      </div>`;
  }
}
</script>

</body>
</html>
